name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - name: Build vmware-vm-control.plugin
        run: |
          cd plugins/vmware-vm-control
          zip -r ../../vmware-vm-control.plugin . -x "*__pycache__*"
      - uses: softprops/action-gh-release@v2
        with:
          files: vmware-vm-control.plugin
          generate_release_notes: true
