name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - name: Add the embeddable Python (Windows x64)
        run: |
          # version and SHA-256 come from the same pin file the launcher uses for the first-start download
          PIN=plugins/vmware-vm-control/server/python-embed.txt
          PY_EMBED_VERSION=$(sed -n 's/^version=//p' "$PIN" | tr -d '\r')
          PY_EMBED_SHA256=$(sed -n 's/^sha256=//p' "$PIN" | tr -d '\r')
          test -n "$PY_EMBED_VERSION" && test -n "$PY_EMBED_SHA256"
          curl -fsSL -o embed.zip "https://www.python.org/ftp/python/${PY_EMBED_VERSION}/python-${PY_EMBED_VERSION}-embed-amd64.zip"
          echo "${PY_EMBED_SHA256}  embed.zip" | sha256sum -c -
          mkdir -p plugins/vmware-vm-control/python
          unzip -q embed.zip -d plugins/vmware-vm-control/python
          test -f plugins/vmware-vm-control/python/python.exe
          test -f plugins/vmware-vm-control/python/LICENSE.txt
          # The Claude app refuses a .plugin that contains a zip file: unpack the standard library
          # (pythonXY.zip) into python/Lib and point pythonXY._pth at that folder.
          cd plugins/vmware-vm-control/python
          mkdir Lib
          unzip -q python3*.zip -d Lib
          rm python3*.zip
          sed -i -E 's/^python3[0-9]+\.zip(\r?)$/Lib\1/' python3*._pth
          grep -q '^Lib' python3*._pth
          test -z "$(find . -iname '*.zip')"
          cd ../../..
      - name: Build vmware-vm-control.plugin
        run: |
          cd plugins/vmware-vm-control
          zip -r ../../vmware-vm-control.plugin . -x "*__pycache__*"
          cd ../..
          if unzip -Z1 vmware-vm-control.plugin | grep -qi '\.zip$'; then echo "nested zip in package"; exit 1; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: vmware-vm-control.plugin
          generate_release_notes: true
